apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sluice.fullname" . }}-config
  labels:
    {{- include "sluice.labels" . | nindent 4 }}
data:
  # Key names must match the yaml tags in internal/config/config.go. The loader
  # ignores keys it does not recognise, so a misspelling here yields a pod that
  # starts cleanly with the feature switched off. internal/config's
  # TestHelmConfigMapKeysMatchSchema guards this template against that drift.
  config.yaml: |
    server:
      listen: ":8080"
      http_listen: ":8081"

      backends:
        {{- range .Values.backends }}
        - addr: {{ .addr | quote }}
          {{- if .weight }}
          weight: {{ .weight }}
          {{- end }}
        {{- end }}

      load_balancer: {{ .Values.config.loadBalancer.algorithm | quote }}

      health:
        interval: {{ .Values.config.health.interval | quote }}
        timeout: {{ .Values.config.health.timeout | quote }}
        unhealthy_threshold: {{ .Values.config.health.unhealthyThreshold }}
        healthy_threshold: {{ .Values.config.health.healthyThreshold }}
        check_type: {{ .Values.config.health.checkType | quote }}
        http_path: {{ .Values.config.health.httpPath | default "/health" | quote }}

      rate_limit:
        enabled: {{ .Values.config.rateLimit.enabled }}
        rate: {{ .Values.config.rateLimit.rate }}
        burst: {{ .Values.config.rateLimit.burst }}

      circuit_breaker:
        enabled: {{ .Values.config.circuitBreaker.enabled }}
        failure_threshold: {{ .Values.config.circuitBreaker.failureThreshold }}
        success_threshold: {{ .Values.config.circuitBreaker.successThreshold }}
        max_half_open_requests: {{ .Values.config.circuitBreaker.maxHalfOpenRequests | default .Values.config.circuitBreaker.successThreshold }}
        timeout: {{ .Values.config.circuitBreaker.timeout | quote }}
        window: {{ .Values.config.circuitBreaker.window | default "60s" | quote }}

      admin:
        enabled: true
        listen: ":9090"

      metrics:
        enabled: true
        path: "/metrics"

      tcp_pool:
        enabled: {{ .Values.config.tcpPool.enabled }}
        max_idle: {{ .Values.config.tcpPool.maxIdle }}
        idle_timeout: {{ .Values.config.tcpPool.idleTimeout | quote }}
        max_lifetime: {{ .Values.config.tcpPool.maxLifetime | quote }}

      logging:
        level: {{ .Values.config.logLevel | quote }}
        format: {{ .Values.config.logFormat | quote }}
