# Prometheus configuration for Sluice

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Sluice metrics
  - job_name: 'sluice'
    static_configs:
      - targets: ['sluice:9091']
    metrics_path: /metrics
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
