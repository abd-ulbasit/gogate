# GoGate configuration for the docker-compose stack in this directory.
#
# Key names must match the yaml tags in internal/config/config.go. Unrecognised
# keys are silently ignored by the loader, so a camelCase spelling here starts
# the container with the feature switched off; internal/config tests assert this
# file parses into a config with the features below actually enabled.

server:
  # L4: raw TCP passthrough
  listen: ":8080"
  # L7: HTTP with the middleware chain
  http_listen: ":8081"

  # Backends (container hostnames from docker-compose.yaml)
  backends:
    - addr: "backend1:8080"
      weight: 3
    - addr: "backend2:8080"
      weight: 3
    - addr: "backend3:8080"
      weight: 1    # canary: ~14% of traffic

  load_balancer: "weighted_round_robin"

  health:
    interval: 5s
    timeout: 2s
    unhealthy_threshold: 3
    healthy_threshold: 2
    check_type: "http"
    http_path: "/"

  rate_limit:
    enabled: true
    rate: 1000
    burst: 100

  circuit_breaker:
    enabled: true
    failure_threshold: 5
    success_threshold: 2
    max_half_open_requests: 2
    timeout: 30s
    window: 60s

  admin:
    enabled: true
    listen: ":9090"

  metrics:
    enabled: true
    path: "/metrics"

  registry:
    enabled: false

  tcp_pool:
    enabled: true
    max_idle: 10
    idle_timeout: 60s
    max_lifetime: 300s

  logging:
    level: "info"
    format: "json"
    add_source: false
