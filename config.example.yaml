# Sluice configuration reference.
#
# Every key below is read by internal/config/config.go. Anything the binary does
# not implement is not listed here - if a setting appears in this file, it works.
# Copy to config.yaml and edit.
#
#   ./bin/sluice -config config.yaml

server:
  # L4 listener: raw TCP. Bytes are copied between client and backend without
  # being parsed, so this works for Postgres, Redis, gRPC, anything. Required.
  listen: ":8080"

  # L7 listener: HTTP. Requests go through the middleware chain and are re-issued
  # to the backend as new HTTP requests. Omit or leave empty to run L4 only.
  # Both listeners share one backend set, load balancer and health checker.
  http_listen: ":8081"

  # Backend pool. Both listeners proxy to these.
  backends:
    - addr: "127.0.0.1:9001"
      weight: 1
    - addr: "127.0.0.1:9002"
      weight: 1
    - addr: "127.0.0.1:9003"
      weight: 2   # receives 2x the traffic of a weight-1 backend

  # round_robin | weighted_round_robin | least_connections
  #
  #   round_robin          - even split; assumes backends are interchangeable
  #   weighted_round_robin - honours `weight`; smooth (NGINX) distribution, so
  #                          weights [5,1,1] yield A A B A A C A, not AAAAA B C
  #   least_connections    - routes to the fewest in-flight connections; the
  #                          right choice for long-lived L4 connections, where
  #                          round-robin counts connections rather than work
  load_balancer: "weighted_round_robin"

  # Active health checking. Runs independently of request traffic, so a backend
  # that has received no requests still has a known state.
  health:
    interval: 5s              # how often to probe
    timeout: 2s               # per-probe timeout
    unhealthy_threshold: 3    # consecutive failures before ejecting
    healthy_threshold: 2      # consecutive successes before reinstating
    check_type: "tcp"         # tcp | http
    http_path: "/health"      # only used when check_type is http

  # Token bucket rate limiting, shared by both listeners so the rate is a budget
  # for the process rather than per-layer. Tokens are computed from elapsed time
  # on each call - there is no refill goroutine to leak.
  rate_limit:
    enabled: true
    rate: 1000      # sustained tokens per second
    burst: 100      # bucket capacity: how far above `rate` a spike may go

  # Per-backend circuit breakers. L4 and L7 keep separate breakers for the same
  # backend: a backend can accept TCP while returning 502s over HTTP.
  circuit_breaker:
    enabled: true
    failure_threshold: 5        # failures within `window` before opening
    success_threshold: 1        # probe successes in half-open before closing
    timeout: 30s                # how long to stay open before probing again
    window: 60s                 # rolling window for counting failures
    # Probes admitted concurrently in half-open. Defaults to success_threshold.
    # This is what stops the entire backlog from reaching a recovering backend
    # the instant `timeout` expires. Set to 1 for the most cautious probe.
    max_half_open_requests: 1

  # Admin server: /health, /stats, /backends, and /metrics when metrics.enabled.
  admin:
    enabled: true
    listen: ":9090"

  # Prometheus exposition, served by the admin server.
  metrics:
    enabled: true
    path: "/metrics"

  # Reuse of idle TCP connections to backends, for the L4 path. Connections are
  # liveness-checked before reuse (zero read deadline + 1-byte read), so a
  # backend that closed an idle connection does not surface as a failed request.
  # Off by default. On the L4 path this can never register a hit: each copy
  # direction half-closes its destination and a half-closed connection is not
  # poolable, so enabling it only adds bookkeeping. See the observability
  # section of the README for why making it work is the wrong trade.
  tcp_pool:
    enabled: false
    max_idle: 128
    idle_timeout: 30s
    max_lifetime: 2m

  # net/http.Transport tuning for the L7 path.
  http_transport:
    max_idle_conns: 200
    max_idle_conns_per_host: 50
    max_conns_per_host: 0        # 0 = unlimited
    idle_conn_timeout: 90s
    tls_handshake_timeout: 10s
    expect_continue_timeout: 1s
    dial_timeout: 30s
    dial_keepalive: 30s
    disable_compression: true    # let the backend own content encoding

  # Service registry: backends register themselves with a TTL and heartbeat
  # instead of being listed above. Registrations that stop heartbeating expire
  # and are removed from the load balancer.
  registry:
    enabled: false
    listen: ":8500"
    default_ttl: 30s
    cleanup_interval: 10s
    max_services: 0              # 0 = unlimited

  logging:
    level: "info"      # debug | info | warn | error
    format: "json"     # json | text
    add_source: false  # include file:line (costly; for debugging only)
