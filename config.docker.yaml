# GoGate configuration for the docker-compose stack in the repository root.
#
# Key names must match the yaml tags in internal/config/config.go; see
# config.example.yaml for the annotated reference.

server:
  # L4: raw TCP passthrough
  listen: ":8080"
  # L7: HTTP with the middleware chain
  http_listen: ":8081"

  backends:
    - addr: "backend-1:80"
      weight: 1
    - addr: "backend-2:80"
      weight: 1

  load_balancer: "round_robin"

  health:
    interval: 5s
    timeout: 2s
    unhealthy_threshold: 3
    healthy_threshold: 2
    check_type: "http"
    http_path: "/"

  rate_limit:
    enabled: true
    rate: 1000
    burst: 50

  circuit_breaker:
    enabled: true
    failure_threshold: 5
    success_threshold: 2
    max_half_open_requests: 2
    timeout: 30s
    window: 60s

  admin:
    enabled: true
    listen: ":9091"

  metrics:
    enabled: true
    path: "/metrics"

  registry:
    enabled: false

  tcp_pool:
    enabled: true
    max_idle: 100
    idle_timeout: 30s

  http_transport:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    dial_timeout: 10s

  logging:
    level: "info"
    format: "json"
    add_source: false
